server {
    listen 80;
    server_name __CLIENT_SUBDOMAIN__.aristral.com;

    # Redirect HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name __CLIENT_SUBDOMAIN__.aristral.com;

    ssl_certificate     /etc/letsencrypt/live/__CLIENT_SUBDOMAIN__.aristral.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__CLIENT_SUBDOMAIN__.aristral.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Next.js app
    location / {
        proxy_pass         http://127.0.0.1:__APP_PORT__;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # NestJS API — proxied under /api so cookies are same-origin
    location /api/ {
        proxy_pass         http://127.0.0.1:__API_PORT__/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
